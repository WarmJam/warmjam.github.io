<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
  :root { --gold: #ffd23f; --panel: rgba(20,24,32,.86); --line: rgba(255,255,255,.14); --txt: #eef2f8; --acc: #3a8bff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1116; color: var(--txt); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
  #cv { position: fixed; inset: 0; display: block; }
  .hide { display: none !important; }
  button { font-family: inherit; color: inherit; border: 0; cursor: pointer; }

  /* 顶部信息 */
  #top { position: fixed; left: 0; right: 0; top: 0; height: 60px; display: flex; align-items: center; gap: 8px; padding: 0 max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left)); background: linear-gradient(180deg, rgba(10,12,18,.95), rgba(10,12,18,.7)); border-bottom: 1px solid var(--line); z-index: 5; }
  .ibtn { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.08); font-size: 18px; flex: none; }
  .ibtn.txt { width: auto; padding: 0 10px; font-size: 13px; }
  .pl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 4px 12px; border-radius: 14px; border: 2px solid transparent; background: rgba(255,255,255,.05); transition: .2s; height: 52px; }
  .pl.on { border-color: var(--gold); background: rgba(255,210,63,.1); }
  .pl .nm { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .pl .tg { font-size: 11px; opacity: .8; white-space: nowrap; }
  .pl .sc { font-size: 24px; font-weight: 800; color: var(--gold); margin-left: auto; font-variant-numeric: tabular-nums; }
  .pl .bl { display: flex; gap: 5px; align-items: center; overflow: visible; margin-left: auto; flex-shrink: 0; padding: 4px 6px; }
  .pl { overflow: visible; }
  #mid { overflow: visible; padding: 0 4px; gap: 5px; }
  .hb { --s: 40px; width: var(--s); height: var(--s); flex: none; border-radius: 50%; position: relative; display: grid; place-items: center;
    box-shadow: inset calc(var(--s) * -.12) calc(var(--s) * -.16) calc(var(--s) * .22) rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.55); }
  .hb::after { content: ''; position: absolute; left: 18%; top: 12%; width: 32%; height: 24%; border-radius: 50%; background: radial-gradient(rgba(255,255,255,.9), rgba(255,255,255,0) 70%); }
  .hb span { width: 52%; height: 52%; border-radius: 50%; background: #fff; color: #111; font-weight: 800; font-size: calc(var(--s) * .3); display: grid; place-items: center; line-height: 1; }
  .hb.sm { --s: 30px; }
  .hb.off { opacity: .18; }
  .hb.tgt { box-shadow: inset calc(var(--s) * -.12) calc(var(--s) * -.16) calc(var(--s) * .22) rgba(0,0,0,.5), 0 0 0 2px #ffd23f, 0 0 12px rgba(255,210,63,.7); }
  .pl em { font-style: normal; font-weight: 800; font-size: 16px; color: #fff; margin-left: -2px; }
  .fb { font-size: 12px; font-weight: 800; color: #3a2400; background: #ffd23f; border-radius: 8px; padding: 2px 6px; white-space: nowrap; }
  #p1 { flex-direction: row-reverse; text-align: right; }
  #p1 .sc, #p1 .bl { margin-left: 0; margin-right: auto; }
  #mid em { font-style: normal; font-weight: 800; font-size: 15px; margin-left: 2px; }
  .mb { width: 16px; height: 16px; border-radius: 50%; font-size: 9px; font-weight: 700; display: grid; place-items: center; color: #111; box-shadow: inset -2px -2px 3px rgba(0,0,0,.35); flex: none; }
  .mb span { background: #fff; border-radius: 50%; width: 10px; height: 10px; display: grid; place-items: center; line-height: 1; }
  .mb.off { opacity: .2; }
  #mid { display: flex; gap: 3px; align-items: center; justify-content: center; flex: none; }
  @media (max-width: 900px) { .hb { --s: 30px; } .hb.sm { --s: 22px; } .pl .nm { font-size: 13px; } }
  @media (max-width: 700px) { .pl .tg { display: none; } .hb { --s: 24px; } .hb.sm { --s: 18px; } #top { height: 54px; } .pl { height: 46px; padding: 3px 8px; } }

  /* 控制区 */
  .ctl { position: fixed; z-index: 4; display: flex; gap: 10px; padding: 10px; }
  #lp { left: 0; top: 52px; bottom: 0; width: 86px; flex-direction: column; padding-left: max(10px, env(safe-area-inset-left)); }
  #rp { right: 0; top: 52px; bottom: 0; width: 138px; flex-direction: column; align-items: center; padding-right: max(10px, env(safe-area-inset-right)); }
  body.port #lp { left: 0; right: 0; top: auto; bottom: 150px; width: auto; height: 62px; flex-direction: row; padding: 8px 12px 6px; }
  body.port #rp { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 150px; flex-direction: row; padding: 6px 12px max(10px, env(safe-area-inset-bottom)); align-items: stretch; }
  .lbl { font-size: 11px; opacity: .7; text-align: center; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; position: relative; overflow: hidden; }
  #power { flex: 1; touch-action: none; }
  #powerFill { position: absolute; left: 0; right: 0; top: 0; height: 0; background: linear-gradient(180deg, #3adf7a, #ffd23f 60%, #ff4a3a); opacity: .9; }
  body.port #powerFill { top: 0; bottom: 0; left: 0; right: auto; width: 0; height: auto; background: linear-gradient(90deg, #3adf7a, #ffd23f 60%, #ff4a3a); }
  #powerTxt { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 13px; text-shadow: 0 1px 2px #000; pointer-events: none; writing-mode: vertical-rl; letter-spacing: 3px; }
  body.port #powerTxt { writing-mode: horizontal-tb; letter-spacing: 1px; font-size: 12px; white-space: nowrap; }
  #power .tick { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,.15); }
  #spinWrap { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; }
  #spin { width: 104px; height: 104px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #fff, #e8e4d8 55%, #a8a498); border: 3px solid rgba(255,255,255,.2); position: relative; touch-action: none; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  body.port #spin { width: 96px; height: 96px; }
  #spin::before, #spin::after { content: ''; position: absolute; background: rgba(0,0,0,.12); }
  #spin::before { left: 50%; top: 8%; bottom: 8%; width: 1px; }
  #spin::after { top: 50%; left: 8%; right: 8%; height: 1px; }
  #spinDot { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #e0202a; box-shadow: 0 0 0 3px rgba(224,32,42,.3); left: 50%; top: 50%; pointer-events: none; }
  #spinTxt { font-size: 11px; opacity: .85; min-height: 14px; }
  #elevWrap { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; width: 100%; }
  #elev { width: 100%; height: 30px; touch-action: none; }
  body.port #elevWrap { width: 64px; }
  body.port #elev { width: 34px; height: auto; flex: 1; }
  #elevFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(58,139,255,.55); }
  body.port #elevFill { top: auto; right: 0; width: auto; height: 0; }
  #fine { flex: 1; width: 64px; touch-action: none; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.18) 0 2px, transparent 2px 9px); }
  body.port #fine { width: auto; height: auto; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 2px, transparent 2px 9px); }
  #fineWrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 0; }
  body.port #fineWrap { min-width: 0; }
  body.port #fineWrap #fine { width: 100%; }
  #shootBtn { width: 100%; height: 40px; border-radius: 12px; background: linear-gradient(180deg, #ffe066, #f0a400); color: #3a2400; font-weight: 800; font-size: 15px; flex: none; }
  body.port #shootBtn { width: 64px; height: auto; }

  #toast { position: fixed; left: 50%; top: 62px; transform: translateX(-50%); z-index: 8; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .msg { background: rgba(0,0,0,.78); border: 1px solid var(--line); padding: 7px 14px; border-radius: 12px; font-size: 14px; animation: msg 3.4s forwards; white-space: nowrap; }
  .msg.foul { border-color: #ff5a4a; color: #ffd0cc; }
  .msg.good { border-color: #3adf7a; }
  @keyframes msg { 0% { opacity: 0; transform: translateY(-6px); } 8%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  #mhelp { position: fixed; z-index: 3; left: 50%; bottom: 6px; transform: translateX(-50%); font-size: 12px; background: rgba(0,0,0,.55); padding: 4px 12px; border-radius: 999px; opacity: .75; pointer-events: none; white-space: nowrap; display: none; }
  @media (pointer: fine) { body.land #mhelp { display: block; } }
  #think { position: fixed; z-index: 7; left: 50%; bottom: 20px; transform: translateX(-50%); background: rgba(0,0,0,.7); padding: 6px 14px; border-radius: 999px; font-size: 13px; }

  /* 菜单 */
  .ov { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: radial-gradient(circle, rgba(20,30,50,.9), rgba(5,8,14,.97)); padding: 14px; overflow: auto; }
  .card { width: min(560px, 100%); background: #161b25; border: 1px solid var(--line); border-radius: 22px; padding: 20px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .card h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: 2px; }
  .card .sub { opacity: .6; font-size: 13px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
  .row > b { width: 76px; font-size: 14px; font-weight: 600; opacity: .85; flex: none; }
  .seg { display: flex; flex: 1; background: rgba(255,255,255,.06); border-radius: 12px; padding: 3px; gap: 3px; min-width: 220px; }
  .seg button { flex: 1; padding: 9px 4px; border-radius: 9px; background: transparent; font-size: 14px; }
  .seg button.on { background: var(--acc); color: #fff; font-weight: 700; }
  .note { font-size: 12px; opacity: .55; margin: -6px 0 0 86px; }
  .big { width: 100%; margin-top: 16px; padding: 14px; border-radius: 14px; font-size: 18px; font-weight: 800; background: linear-gradient(180deg, #ffe066, #f0a400); color: #3a2400; }
  .big.sec { background: rgba(255,255,255,.1); color: var(--txt); margin-top: 8px; font-size: 15px; font-weight: 600; }
  .help { font-size: 12px; opacity: .6; line-height: 1.7; margin-top: 12px; }
  .help b { opacity: 1; color: var(--gold); font-weight: 600; }
  .cardhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .langsw { display: flex; background: rgba(255,255,255,.08); border-radius: 10px; padding: 2px; flex: none; }
  .langsw button { padding: 5px 11px; border-radius: 8px; background: transparent; font-size: 12px; font-weight: 600; opacity: .7; }
  .langsw button.on { background: var(--acc); color: #fff; opacity: 1; }
  .links { display: flex; gap: 18px; justify-content: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; }
  .links a { color: #9ec5ff; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .links a:hover { color: #fff; text-decoration: underline; }
  .help > div { margin-bottom: 2px; }
  #overT { font-size: 24px; font-weight: 800; color: var(--gold); text-align: center; }
  #overR { text-align: center; opacity: .8; margin-top: 6px; }
</style>
</head>
