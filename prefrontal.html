<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧠 前额叶训练 · WarmJam 的小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #f0f4f8; min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  header { text-align: center; padding: 12px 0 20px; }
  header h1 { font-size: 1.8rem; }
  header a { color: #7d97a9; font-size: .85rem; text-decoration: none; }
  header a:hover { color: #ffd93b; }
  .screen.hidden { display: none; }
  .card {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 26px 22px; text-align: center;
  }
  .card p.desc { color: #b9cddb; font-size: .95rem; line-height: 1.7; margin-bottom: 20px; }
  .diff-box { margin: 6px 0 22px; }
  .diff-box label { font-size: .95rem; color: #cfe3ef; }
  .diff-box label b { color: #ffd93b; font-size: 1.1rem; }
  input[type=range] { width: 100%; margin: 14px 0 6px; accent-color: #ffd93b; }
  .diff-tag { font-size: .85rem; color: #7d97a9; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block; border: none; cursor: pointer; text-decoration: none;
    color: #0f2027; font-weight: 700; background: #ffd93b;
    padding: 12px 30px; border-radius: 10px; font-size: 1rem;
    transition: transform .15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn.ghost { background: transparent; color: #ffd93b; border: 1.5px solid #ffd93b; font-weight: 500; }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; font-size: 1rem; color: #cfe3ef; flex-wrap: wrap; gap: 8px;
  }
  .hud b { color: #ffd93b; font-size: 1.25rem; margin-left: 6px; }
  #pStatus {
    text-align: center; font-size: 1.1rem; font-weight: 700; color: #ffd93b;
    min-height: 1.8em; margin-bottom: 10px;
  }
  .p-grid {
    display: grid; gap: 8px; max-width: 600px; margin: 0 auto;
  }
  .p-cell {
    aspect-ratio: 1/1; border: none; border-radius: 10px; cursor: pointer;
    background: rgba(255,255,255,.12); color: #f0f4f8;
    font-size: 1rem; font-weight: 700;
    font-family: ui-monospace, SFMono-Regular, monospace;
    transition: background .15s, transform .15s;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    min-height: 44px;
  }
  /* 点对：闪一下然后恢复（不暗掉，保持训练难度） */
  .p-cell.hit { background: #ffd93b; color: #0f2027; transform: scale(1.12); }
  /* 点错：红抖一下然后恢复 */
  .p-cell.miss { background: #ff5252; color: #fff; animation: missShake .25s; }
  @keyframes missShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); } 75% { transform: translateX(5px); }
  }
  .p-hint { text-align: center; color: #7d97a9; font-size: .8rem; margin-top: 12px; }
  .diff-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
  .diff-tabs button {
    border: 1.5px solid rgba(255,255,255,.25); background: transparent; color: #cfe3ef;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: .9rem;
  }
  .diff-tabs button.active { background: #ffd93b; color: #0f2027; border-color: #ffd93b; font-weight: 700; }
  #over .card h2 { margin-bottom: 10px; }
  #over .score-big { font-size: 2.6rem; color: #ffd93b; font-weight: 800; margin: 8px 0; }
  #over .sub-line { color: #b9cddb; margin-bottom: 6px; line-height: 1.7; }
  #rankMsg { min-height: 1.6em; color: #b9cddb; margin-bottom: 14px; }
  #rankMsg.good { color: #3ddc84; font-weight: 700; }
  .nick-row { margin-bottom: 18px; color: #cfe3ef; font-size: .95rem; }
  .nick-row input {
    margin-left: 8px; padding: 8px 12px; border-radius: 8px; font-size: 1rem; width: 150px;
    border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.3); color: #fff;
  }
  table.board { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-size: .85rem; }
  table.board th, table.board td { padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,.08); }
  table.board th { color: #7d97a9; font-weight: 500; }
  table.board tr.me td { color: #ffd93b; font-weight: 700; }
  .empty { color: #7d97a9; padding: 24px 0; }
  .hint { color: #7d97a9; font-size: .78rem; line-height: 1.6; margin-top: 10px; }
  .back-row { margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧠 前额叶训练</h1>
    <a href="index.html">← 返回 WarmJam 的主页</a>
  </header>

  <!-- 菜单 -->
  <div id="menu" class="screen">
    <div class="card">
      <p class="desc">格子里散着 <strong>1 到 N</strong> 的数字（随机位置），<br>
      从 <strong>1</strong> 开始按顺序点到最后一个，越快越好！<br>
      点对会闪一下（随后恢复原样，点过的不会变暗——这才是训练），<br>
      点错不扣分，但浪费时间。成绩按 <strong>平均每个数字用时</strong> 算，难度越高越难找。</p>
      <div class="diff-box">
        <label>难度 <b id="diffVal">1</b>　<span class="diff-tag" id="diffTag">6×6 ＝ 36 个数字</span></label>
        <input type="range" id="diffRange" min="1" max="5" step="1" value="1">
      </div>
      <div class="btns">
        <button class="btn" id="startBtn">开始游戏</button>
        <button class="btn ghost" id="recordsBtn">🏆 纪录</button>
      </div>
    </div>
  </div>

  <!-- 排行榜 -->
  <div id="records" class="screen hidden">
    <div class="card">
      <h2 style="margin-bottom:12px">🏆 最快纪录</h2>
      <p class="hint" style="margin-top:0;margin-bottom:12px">各难度独立排名，只跟同难度比</p>
      <div class="diff-tabs" id="diffTabs">
        <button data-d="1" class="active">难度 1</button>
        <button data-d="2">难度 2</button>
        <button data-d="3">难度 3</button>
        <button data-d="4">难度 4</button>
        <button data-d="5">难度 5</button>
      </div>
      <div id="board"></div>
      <div class="back-row"><button class="btn ghost" id="backBtn">返回</button></div>
    </div>
  </div>

  <!-- 游戏 -->
  <div id="game" class="screen hidden">
    <div class="hud">
      <span>进度<b id="hudDone">0/36</b></span>
      <span>下一个<b id="hudNext">1</b></span>
      <span>点错<b id="hudMiss">0</b></span>
      <span>用时<b id="hudTime">0.0s</b></span>
    </div>
    <p id="pStatus"></p>
    <div class="p-grid" id="pGrid"></div>
    <p class="p-hint">从 1 开始按顺序点，点错了会红一下（不扣分）</p>
  </div>

  <!-- 结算 -->
  <div id="over" class="screen hidden">
    <div class="card">
      <h2>完成！</h2>
      <div class="score-big" id="finalScore">0.000 秒/个</div>
      <p class="sub-line" id="subLine"></p>
      <p id="rankMsg"></p>
      <div class="nick-row">昵称 <input id="nick" maxlength="16" placeholder="默认用设备识别码"></div>
      <div class="btns">
        <button class="btn" id="submitBtn">提交成绩</button>
        <button class="btn ghost" id="retryBtn">再来一局</button>
        <button class="btn ghost" id="menuBtn">返回菜单</button>
      </div>
    </div>
  </div>
</div>

<script src="leaderboard.js"></script>
<script>
(function () {
  'use strict';
  var BIN_URL = 'https://api.npoint.io/8cff18ba25e6b3b32294'; // 前额叶训练全站排行榜
  // 难度 -> [列, 行]，难度越高格子越多
  var DIFFS = { 1: [6, 6], 2: [7, 7], 3: [8, 8], 4: [8, 10], 5: [8, 12] };

  var board = WJBoard.create({
    binUrl: BIN_URL,
    localKey: 'wj_board_prefrontal',
    lowerBetter: true,
    decimals: 3,
    scoreLabel: '平均每数(秒)',
    hideDiff: true // 分难度页签展示，难度列多余
  });

  function $(id) { return document.getElementById(id); }
  function show(name) {
    ['menu', 'records', 'game', 'over'].forEach(function (s) {
      $(s).classList.toggle('hidden', s !== name);
    });
    window.scrollTo(0, 0);
  }

  // ---- 难度选择 ----
  var diff = 1;
  var diffRange = $('diffRange');
  function updateDiffLabel() {
    diff = parseInt(diffRange.value, 10);
    var c = DIFFS[diff][0], r = DIFFS[diff][1];
    $('diffVal').textContent = diff;
    $('diffTag').textContent = c + '×' + r + ' ＝ ' + (c * r) + ' 个数字';
  }
  diffRange.addEventListener('input', updateDiffLabel);
  updateDiffLabel();

  // 数字补零显示（01、02…09，避免 1-9 和两位数并排突兀）
  function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }

  // ---- 排行榜（分难度页签，各难度独立前十） ----
  var boardDiff = 1;
  function renderDiffBoard(el, all, remote) {
    var list = [];
    for (var i = 0; i < all.length; i++) {
      var e = all[i];
      if (!e || typeof e !== 'object') continue;
      if (parseInt(e.diff, 10) !== boardDiff) continue;
      var s = Number(e.score);
      if (!isFinite(s) || s < 0) continue;
      list.push(e);
    }
    list.sort(function (a, b) { return Number(a.score) - Number(b.score); });
    board.render(el, list.slice(0, 10), remote);
  }
  function loadBoard() {
    var el = $('board');
    el.innerHTML = '<p class="empty">加载中…</p>';
    // 直接拉全量再按难度过滤（board.load 只返回全局前十，不够分难度用）
    fetch(BIN_URL, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (data) {
      renderDiffBoard(el, Array.isArray(data) ? data : [], true);
    }).catch(function () {
      board.load().then(function (res) { renderDiffBoard(el, res.list, res.remote); });
    });
  }
  function syncTabs() {
    var btns = $('diffTabs').querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      b.classList.toggle('active', parseInt(b.getAttribute('data-d'), 10) === boardDiff);
    }
  }
  $('diffTabs').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('button') : null;
    if (!b) return;
    boardDiff = parseInt(b.getAttribute('data-d'), 10) || 1;
    syncTabs();
    loadBoard();
  });
  $('recordsBtn').addEventListener('click', function () {
    boardDiff = diff; // 默认看菜单里选的难度
    syncTabs();
    show('records');
    loadBoard();
  });
  $('backBtn').addEventListener('click', function () { show('menu'); });

  // ---- 游戏 ----
  var grid = $('pGrid'), statusEl = $('pStatus');
  var cells = [], total = 0, next = 1, misses = 0;
  var startTime = 0, timerInt = null, state = 'idle';

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function updateHud() {
    $('hudDone').textContent = (next - 1) + '/' + total;
    $('hudNext').textContent = next <= total ? pad2(next) : '—';
    $('hudMiss').textContent = misses;
  }
  function tick() {
    var s = (performance.now() - startTime) / 1000;
    $('hudTime').textContent = s.toFixed(1) + 's';
  }
  function flash(el, cls, ms) {
    el.classList.add(cls);
    setTimeout(function () { el.classList.remove(cls); }, ms || 180);
  }
  function onCell(v, el) {
    if (state !== 'playing') return;
    if (v === next) {
      // 点对：闪一下然后恢复（不暗掉，保持训练难度）
      flash(el, 'hit', 180);
      next++;
      updateHud();
      if (next > total) { finish(); }
      else { statusEl.textContent = '找 ' + pad2(next); }
    } else {
      // 点错：红抖一下然后恢复，不扣分，只计次
      misses++;
      flash(el, 'miss', 250);
      statusEl.textContent = '点错了，找的是 ' + pad2(next);
      updateHud();
    }
  }
  function startGame() {
    var c = DIFFS[diff][0], r = DIFFS[diff][1];
    total = c * r; next = 1; misses = 0; state = 'playing';
    clearInterval(timerInt);
    var nums = shuffle(Array.apply(null, { length: total }).map(function (_, i) { return i + 1; }));
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = 'repeat(' + c + ', 1fr)';
    cells = [];
    nums.forEach(function (v) {
      var b = document.createElement('button');
      b.className = 'p-cell';
      b.textContent = pad2(v);
      b.setAttribute('aria-label', '数字' + pad2(v));
      b.addEventListener('click', function () { onCell(v, b); });
      grid.appendChild(b);
      cells.push(b);
    });
    updateHud();
    statusEl.textContent = '找 01';
    show('game');
    startTime = performance.now();
    tick();
    timerInt = setInterval(tick, 100);
  }
  function finish() {
    clearInterval(timerInt);
    state = 'over';
    var totalS = (performance.now() - startTime) / 1000;
    var avg = totalS / total;
    var avgRound = Math.round(avg * 1000) / 1000;
    show('over');
    $('finalScore').textContent = avgRound.toFixed(3) + ' 秒/个';
    $('subLine').innerHTML = '难度 ' + diff + '（' + DIFFS[diff][0] + '×' + DIFFS[diff][1] + '）<br>总用时 ' + totalS.toFixed(1) + ' 秒 · 点错 ' + misses + ' 次';
    $('rankMsg').textContent = '';
    $('rankMsg').className = '';
    var nickInput = $('nick');
    if (!nickInput.value) nickInput.value = board.getName();
    $('submitBtn').disabled = false;
    $('submitBtn').onclick = function () {
      var name = nickInput.value.trim() || board.pid;
      board.saveName(nickInput.value.trim());
      $('submitBtn').disabled = true;
      $('rankMsg').textContent = '提交中…';
      board.submit({ name: name, score: avgRound, diff: diff }).then(function (r) {
        var msg = $('rankMsg');
        if (r.rank >= 0) {
          msg.textContent = r.remote
            ? '🎉 上榜！全站第 ' + (r.rank + 1) + ' 名'
            : '🎉 已记入本机纪录（离线）';
          msg.className = 'good';
        } else {
          msg.textContent = r.remote ? '未进入前十，继续加油！' : '提交失败，已记入本机';
          msg.className = '';
        }
      });
    };
  }

  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);
  $('menuBtn').addEventListener('click', function () { clearInterval(timerInt); state = 'idle'; show('menu'); });
})();
</script>
</body>
</html>
